[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntdswolf"
version = "0.6.1"
description = "Offline NTDS.dit parser and credential extractor for Active Directory forensics"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "StrongWind1" }]
keywords = [
  "active-directory",
  "ntds",
  "credential-extraction",
  "dfir",
  "forensics",
  "penetration-testing",
  "red-team",
  "security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "dissect-database",
  "dissect-regf",
  "dpapi-ng",
  "pycryptodome",
  "typing-extensions",
  "typer",
  "rich",
]

[project.urls]
Repository = "https://github.com/StrongWind1/NTDSWolf"
Documentation = "https://strongwind1.github.io/NTDSWolf/"
Changelog = "https://github.com/StrongWind1/NTDSWolf/blob/main/CHANGELOG.md"
Issues = "https://github.com/StrongWind1/NTDSWolf/issues"

[project.scripts]
ntdswolf = "ntdswolf.cli.app:main"

# Pin the upstream git dependencies to specific commits for reproducible builds.
# dissect and dpapi-ng are sourced from git for fixes not yet in a PyPI release.
[tool.uv.sources]
dissect-database = { git = "https://github.com/fox-it/dissect.database", rev = "62f63012578cd429620f239a9a51704738a340bc" }
dissect-regf = { git = "https://github.com/fox-it/dissect.regf", rev = "66de9489e4eb645e69127234c03844d0ebcc4ec2" }
dpapi-ng = { git = "https://github.com/jborean93/dpapi-ng", rev = "eac650f928af3eee494f7312131d540a81c5e8af" }

[tool.hatch.build.targets.wheel]
packages = ["src/ntdswolf"]

[tool.hatch.build.targets.sdist]
exclude = ["/tools", "/site", "/ref"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.11",
  "ty>=0.0.1a7",
  "pre-commit>=4.0",
]
docs = ["mkdocs-material>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 320
src = ["src"]
extend-exclude = ["ref"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Trailing comma - conflicts with ruff formatter
  "ISC001",  # Implicit string concat - conflicts with ruff formatter
  "D203",    # No blank line before docstring - conflicts with D211
  "D213",    # Multi-line docstring at second line - conflicts with D212
  "PLR0913", # Too many arguments - CLI, wire-format, and decoder functions legitimately need many params
]

[tool.ruff.lint.per-file-ignores]
"src/ntdswolf/cli/app.py" = ["PLR0917"]
"tests/**" = [
  "D",
  "S101",
  "S105",
  "S106",
  "ANN",
  "PLR0917",
  "PLR2004",
  "SLF001",
  "N802",
]
"ref/**" = ["ALL"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-License-Identifier"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
replace-imports-with-any = ["dissect.**", "Crypto.**", "dpapi_ng.**"]
allowed-unresolved-imports = []
strict-equality-semantics = true
strict-generic-narrowing = true
respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = ["tests/**", "ref/**"]

[tool.ty.overrides.rules]
all = "ignore"
